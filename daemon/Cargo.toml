[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/daemon",
    "tools/notchsendctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
